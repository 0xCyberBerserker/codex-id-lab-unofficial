name: Build Codex I+D Lab Linux packages

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Require a rebuild; fails if this packaging revision is already published"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  attestations: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: codex-lab-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.freshness.outputs.fresh }}
      package_version: ${{ steps.identity.outputs.package_version }}
      revision: ${{ steps.identity.outputs.revision }}
      upstream_version: ${{ steps.source.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap cpio desktop-file-utils jq curl dpkg-dev rpm zstd libarchive-tools ripgrep gnupg xvfb xdotool

      - name: Test companion core
        run: |
          python3 -m unittest discover -s tests -v
          node --test scripts/lib/linux-features.test.js tests/lab-features.test.js tests/runtime-features.test.js tests/global-dictation.test.js

      - name: Resolve verified Linux source
        id: source
        run: |
          scripts/resolve-linux-source \
            --output ChatGPT-source.deb \
            --metadata-only \
            --github-output "$GITHUB_OUTPUT"

      - name: Define release identity
        id: identity
        env:
          UPSTREAM_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < packaging/revision)"
          [[ "$revision" =~ ^[1-9][0-9]*$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "package_version=$UPSTREAM_VERSION-$revision" >> "$GITHUB_OUTPUT"

      - name: Check release freshness
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.package_version }}
          REVISION: ${{ steps.identity.outputs.revision }}
          UPSTREAM_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          source_sha="$SOURCE_SHA"
          build_recipe_sha="$(scripts/build-recipe-sha)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "build_recipe_sha=$build_recipe_sha" >> "$GITHUB_OUTPUT"
          tag="v$PACKAGE_VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${FORCE_REBUILD:-false}" = "true" ]; then
            echo "Published releases are immutable; bump packaging/revision before rebuilding." >&2
            exit 1
          fi
          mkdir -p existing-release
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --pattern checksums.txt --dir existing-release
          gh attestation verify existing-release/manifest.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          gh attestation verify existing-release/checksums.txt --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          jq -e \
            --arg upstream "$UPSTREAM_VERSION" \
            --arg package_version "$PACKAGE_VERSION" \
            --argjson revision "$REVISION" \
            --arg commit "$GITHUB_SHA" \
            --arg source_sha "$source_sha" \
            --arg recipe_sha "$build_recipe_sha" \
            '.upstreamVersion == $upstream and .packageVersion == $package_version and .packagingRevision == $revision and .commitSha == $commit and .sourceArchiveSha256 == $source_sha and .buildRecipeSha256 == $recipe_sha' \
            existing-release/manifest.json >/dev/null
          while read -r expected_sha asset_name extra; do
            [[ "$expected_sha" =~ ^[0-9a-f]{64}$ && -n "$asset_name" && -z "${extra:-}" && "$(basename "$asset_name")" == "$asset_name" ]]
            if [[ "$asset_name" == manifest.json ]]; then
              [[ "$(sha256sum existing-release/manifest.json | awk '{print $1}')" == "$expected_sha" ]]
            else
              jq -e --arg name "$asset_name" --arg sha "$expected_sha" \
                '[.artifacts[] | select(.name == $name and .sha256 == $sha)] | length == 1' existing-release/manifest.json >/dev/null
            fi
          done < existing-release/checksums.txt
          [[ "$(wc -l < existing-release/checksums.txt)" == 5 ]]
          jq -e '.manifestVersion == 2 and .buildProfile == "release" and .featureProfile == "base" and (.artifacts | length == 4 and (map(.name) | unique | length == 4))' existing-release/manifest.json >/dev/null
          { jq -r '.artifacts[].name' existing-release/manifest.json; echo manifest.json; echo checksums.txt; } | sort -u > existing-release/expected-assets.txt
          { awk '{print $2}' existing-release/checksums.txt; echo checksums.txt; } | sort -u > existing-release/checksum-assets.txt
          diff -u existing-release/expected-assets.txt existing-release/checksum-assets.txt
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort -u > existing-release/actual-assets.txt
          diff -u existing-release/expected-assets.txt existing-release/actual-assets.txt
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      - name: Build packages
        if: steps.freshness.outputs.fresh != 'true'
        env:
          SOURCE_URL: ${{ steps.source.outputs.source_url }}
          REVISION: ${{ steps.identity.outputs.revision }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          scripts/resolve-linux-source --output ChatGPT-source.deb --download-from-cache
          scripts/build-from-linux \
            --source ChatGPT-source.deb \
            --source-url "$SOURCE_URL" \
            --version "$VERSION" \
            --revision "$REVISION"

      - name: Validate release artifacts
        if: steps.freshness.outputs.fresh != 'true'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          scripts/validate-release-artifacts dist "$VERSION" "$REVISION"

      - name: Smoke anonymous native candidate without account access
        if: steps.freshness.outputs.fresh != 'true'
        run: |
          TASK_SMOKE_CANDIDATE=$(mktemp -d /tmp/codex-lab-smoke.XXXXXX)
          cp -a build/work/pkgroot/opt/codex-id-lab-unofficial/. "$TASK_SMOKE_CANDIDATE/"
          scripts/smoke-linux-candidate "$TASK_SMOKE_CANDIDATE"

      - name: Privacy audit
        if: steps.freshness.outputs.fresh != 'true'
        run: scripts/privacy-audit

      - name: Stage release artifacts
        if: steps.freshness.outputs.fresh != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.identity.outputs.package_version }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.fresh != 'true' && github.ref == 'refs/heads/main' && vars.CODEX_LAB_RELEASE_PROMOTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.package_version }}
          path: dist

      - name: Create immutable draft
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
          REVISION: ${{ needs.build.outputs.revision }}
          UPSTREAM_VERSION: ${{ needs.build.outputs.upstream_version }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          gh release create "v$PACKAGE_VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Codex I+D Lab - Unofficial $PACKAGE_VERSION" \
            --notes "Unofficial Linux package build for upstream $UPSTREAM_VERSION, packaging revision $REVISION."

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Verify complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
          gh release view "v$PACKAGE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt

      - name: Promote complete release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          gh release edit "v$PACKAGE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
