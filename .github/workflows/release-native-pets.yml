name: Publish experimental native pets setup

on:
  push:
    tags: ["native-pets-v*"]

permissions:
  contents: read

concurrency:
  group: native-pets-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.1'
          package-manager-cache: false
      - name: Verify public inputs
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^native-pets-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm --prefix tools/asar-builder ci --ignore-scripts --no-fund
          npm --prefix tools/asar-builder audit --audit-level=low
          node --check scripts/install-experimental-native-pets.mjs
          node --test tests/native-pet-quota.test.mjs tests/runtime-features.test.js
          python3 -m unittest discover -s tests -p test_native_pets.py
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          scripts/privacy-audit
          git diff --exit-code
      - name: Build source-only setup archive
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix=codex-lab-native-pets/ HEAD -- \
            LICENSE NOTICE.md DISCLAIMER.md third-party/ilysenko/LICENSE \
            linux-features/compatibility.json linux-features/native-pet-quota \
            packaging/profiles/experimental-native-pets.json \
            scripts/codex_lab_pet.py scripts/install-experimental-native-pets.mjs \
            scripts/native_pets_first_launch.py scripts/launch-native-pets-candidate \
            scripts/lab-features.js scripts/lab-runtime-features.js scripts/lib/linux-features.js \
            tools/asar-builder tools/native-pet-art > dist/codex-lab-native-pets.tar.gz
          tar -tzf dist/codex-lab-native-pets.tar.gz > members.txt
          grep -Fx 'codex-lab-native-pets/scripts/install-experimental-native-pets.mjs' members.txt
          if grep -Ei '/(build|\.codex|node_modules)/|\.(asar|png|webp|gif|db|zip|deb|rpm)$' members.txt; then
            echo "Unexpected build, profile or runtime asset in the public archive" >&2
            exit 1
          fi
          (cd dist && sha256sum codex-lab-native-pets.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-pets-setup
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: vars.CODEX_LAB_RELEASE_PROMOTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-pets-setup
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Verify and promote the experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          gh attestation verify dist/codex-lab-native-pets.tar.gz --repo "$GITHUB_REPOSITORY"
          gh release create "$GITHUB_REF_NAME" dist/codex-lab-native-pets.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false \
            --title "Codex Lab Native Pets (experimental) ${GITHUB_REF_NAME#native-pets-}" \
            --notes "Source setup for a disposable copy of Codex Lab 26.1117.41037-8. Generates Pirate Null locally and adds native quota without bundling art or profile data. See linux-features/native-pet-quota/README.md. Not an update for the stable channel. Mouse gaze and mixed-monitor drag are outside this prerelease."
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir downloaded \
            --pattern codex-lab-native-pets.tar.gz --pattern SHA256SUMS
          cmp dist/SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded && sha256sum -c SHA256SUMS)
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false
